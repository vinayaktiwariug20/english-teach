<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone preview</title>
<style>
  body { margin: 0; font: 13px system-ui, sans-serif; background: #2b2b2b; color: #eee;
         display: flex; gap: 24px; padding: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { padding: 6px 2px; opacity: .8; }
  iframe { border: 0; background: #fff; border-radius: 10px; display: block; }
</style>
</head>
<body>
  <!--
    Dev-only. Inside an iframe, vh/vw/dvh resolve against the frame, so this is
    a real test of the layout at phone dimensions rather than a scaled picture.
    It does NOT test touch, device pixel ratio, system gesture bars or the
    device's speech voices - only the real handset can.
  -->
  <figure>
    <iframe src="../index.html?nosw" width="412" height="915"></iframe>
    <figcaption>412 x 915 - typical Android portrait</figcaption>
  </figure>
  <figure>
    <iframe src="../index.html?nosw" width="360" height="640"></iframe>
    <figcaption>360 x 640 - small/older Android</figcaption>
  </figure>
  <figure>
    <iframe src="../index.html?nosw" width="740" height="360"></iframe>
    <figcaption>740 x 360 - landscape</figcaption>
  </figure>
</body>
</html>
